name: Publish Tauri release artifacts

on:
  workflow_run:
    workflows: ["Tauri release build"]
    types: [completed]
  workflow_dispatch:

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: false

      - name: Prepare release directory
        run: |
          mkdir -p release-payload
          find release-artifacts -type f \( -iname "*.msi" -o -iname "*.exe" -o -iname "*.deb" -o -iname "*.rpm" \) -exec cp {} release-payload/ \;
          ls -l release-payload

      - name: Create GitHub release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v0.1.0' }}
          generate_release_notes: true
          files: |
            release-payload/*
