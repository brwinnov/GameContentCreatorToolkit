name: Tauri release build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.platform }} artifacts
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            bundle_args: --bundles msi
            artifact_name: windows-artifacts
          - os: ubuntu-22.04
            platform: linux
            bundle_args: --bundles deb,rpm
            artifact_name: linux-artifacts

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            git \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            rpm

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Validate tagged release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/validate-release-version.mjs

      - name: Build Tauri app
        working-directory: app
        env:
          GCC_BUILD_NUMBER: ${{ github.run_number }}
        run: npx tauri build ${{ matrix.bundle_args }}

      - name: Verify Windows MSI identity
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $config = Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $versionPattern = "_$([regex]::Escape($config.version))_"
          $packages = @(
            Get-ChildItem app/src-tauri/target/release/bundle/msi/*.msi |
              Where-Object Name -Match $versionPattern
          )
          if ($packages.Count -ne 1) {
            throw "Expected one MSI for $($config.version); found $($packages.Count)."
          }

          $installer = New-Object -ComObject WindowsInstaller.Installer
          $database = $installer.OpenDatabase($packages[0].FullName, 0)

          $versionView = $database.OpenView(
            "SELECT Value FROM Property WHERE Property='ProductVersion'"
          )
          $versionView.Execute()
          $productVersion = [string]$versionView.Fetch().StringData(1)

          $upgradeView = $database.OpenView(
            "SELECT Value FROM Property WHERE Property='UpgradeCode'"
          )
          $upgradeView.Execute()
          $upgradeCode = [string]$upgradeView.Fetch().StringData(1)

          $expectedUpgradeCode = "{$($config.bundle.windows.wix.upgradeCode.ToUpperInvariant())}"
          if ($productVersion -cne $config.version) {
            throw "MSI version '$productVersion' does not match '$($config.version)'."
          }
          if ($upgradeCode -cne $expectedUpgradeCode) {
            throw "MSI UpgradeCode '$upgradeCode' does not match '$expectedUpgradeCode'."
          }

          "Verified MSI $productVersion with UpgradeCode $upgradeCode"

      - name: Upload unsigned Windows artifact for SignPath
        if: matrix.platform == 'windows' && startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ENABLED == 'true'
        id: upload-unsigned-windows
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-unsigned-artifacts
          path: app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Prepare SignPath parameters
        if: matrix.platform == 'windows' && startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ENABLED == 'true'
        id: signpath-parameters
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid release version '$version'."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Submit Windows artifact to SignPath
        if: matrix.platform == 'windows' && startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ENABLED == 'true'
        uses: SignPath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2.3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: game-content-creator-toolkit
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows-msi
          github-artifact-id: ${{ steps.upload-unsigned-windows.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-artifacts
          parameters: |
            version: ${{ toJSON(steps.signpath-parameters.outputs.version) }}

      - name: Verify signed Windows MSI
        if: matrix.platform == 'windows' && startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem signed-artifacts -Recurse -Filter *.msi)
          if ($packages.Count -ne 1) {
            throw "Expected one signed MSI; found $($packages.Count)."
          }
          $signature = Get-AuthenticodeSignature $packages[0].FullName
          if ($signature.Status -ne 'Valid') {
            throw "MSI signature is not valid: $($signature.StatusMessage)"
          }
          if ($signature.SignerCertificate.Subject -notmatch 'SignPath Foundation') {
            throw "Unexpected signer: $($signature.SignerCertificate.Subject)"
          }
          if (-not $signature.TimeStamperCertificate) {
            throw 'MSI signature does not contain a timestamp.'
          }
          "Verified $($packages[0].Name) signed by $($signature.SignerCertificate.Subject)"

      - name: Upload signed Windows artifact
        if: matrix.platform == 'windows' && startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-artifacts
          path: signed-artifacts/**/*.msi
          if-no-files-found: error

      - name: Upload unsigned Windows release artifact
        if: matrix.platform == 'windows' && startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ENABLED != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-artifacts
          path: app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Upload validation and Linux artifacts
        if: matrix.platform == 'linux' || !startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            app/src-tauri/target/release/bundle/**/*.msi
            app/src-tauri/target/release/bundle/**/*.deb
            app/src-tauri/target/release/bundle/**/*.rpm
            app/src-tauri/target/release/bundle/**/*.AppImage
            app/src-tauri/target/release/bundle/**/*.tar.gz
            app/src-tauri/target/release/bundle/**/*.zip
          if-no-files-found: error
